apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-dns-egress
  namespace: payments-processing
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow UDP and TCP DNS queries to kube-system (kube-dns / NodeLocal DNS)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow NodeLocal DNSCache queries on host IP / local loopback
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

